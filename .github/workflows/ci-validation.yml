name: CI Validation

on:
  push:
    branches:
      - develop
      - main
      - "feat/*"
      - "feature/*" # <--- Esto activa el CI en tus ramas de trabajo
  pull_request:
    branches: [main, develop]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # --- ESTO ES LO QUE SOLUCIONA EL ERROR ---para mocks tests
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SECURITY_TOKEN: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      # -----------------------------------------
      PYTHONPATH: src # <--- ESTA ES LA LLAVE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint with Black
        run: poetry run black --check .

      - name: Run Tests
        run: poetry run pytest

      - name: Install Poetry export plugin
        run: pipx inject poetry poetry-plugin-export

      - name: Build Lambda Artifacts for Terraform Validation
        run: |
          rm -rf dist/
          mkdir -p dist/worker dist/dispatcher dist/status dist/upload dist/auth dist/resumer
          poetry export -f requirements.txt --output dist/requirements.txt

          for cmd in worker dispatcher status upload auth resumer; do
            echo "📦 Empaquetando $cmd..."
            pip install -r dist/requirements.txt -t dist/$cmd/ --ignore-installed --quiet
            if [ "$cmd" == "worker" ]; then cp src/worker/handler.py dist/worker/; fi
            if [ "$cmd" == "dispatcher" ]; then cp src/dispatcher/dispatcher.py dist/dispatcher/; fi
            if [ "$cmd" == "status" ]; then cp src/status/status.py dist/status/; fi
            if [ "$cmd" == "upload" ]; then cp src/upload/upload.py dist/upload/; fi
            if [ "$cmd" == "auth" ]; then cp src/auth/auth_handler.py dist/auth/; fi
            if [ "$cmd" == "resumer" ]; then cp src/resumer/resumer.py dist/resumer/; fi
            cp -r src/shared dist/$cmd/
            cd dist/$cmd && zip -r ../$cmd.zip . > /dev/null && cd ../..
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -diff -recursive infra/environments/dev
          terraform fmt -check -diff -recursive infra/environments/prod
          terraform fmt -check -diff -recursive infra/observability

      - name: Initialize Terraform without remote backend
        run: |
          terraform -chdir=infra/environments/dev init -backend=false -input=false -upgrade=false
          terraform -chdir=infra/environments/prod init -backend=false -input=false -upgrade=false
          terraform -chdir=infra/observability/environments/dev init -backend=false -input=false -upgrade=false

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/environments/dev validate
          terraform -chdir=infra/environments/prod validate
          terraform -chdir=infra/observability/environments/dev validate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            observability/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install observability frontend dependencies
        working-directory: observability/frontend
        run: npm ci

      - name: Lint observability frontend
        working-directory: observability/frontend
        run: npm run lint

      - name: Build observability frontend
        working-directory: observability/frontend
        run: npm run build

  deploy-dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: validate
    uses: ./.github/workflows/cd-deploy.yml
    secrets: inherit

  deploy-prod:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: validate
    uses: ./.github/workflows/cd-prod.yml
    secrets: inherit
