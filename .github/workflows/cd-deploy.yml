name: CD Deployment (Dev)

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  # --- TRABAJO 1: INFRAESTRUCTURA Y BACKEND ---
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Poetry Export Plugin
        run: poetry self add poetry-plugin-export

      - name: Build Lambda Artifacts
        run: |
          # 1. Preparar carpetas
          rm -rf dist/
          mkdir -p dist/worker dist/dispatcher dist/status dist/upload

          # 2. Generar manifiesto de dependencias
          poetry export -f requirements.txt --output dist/requirements.txt

          # 3. Construir WORKER
          pip install -r dist/requirements.txt -t dist/worker/ --ignore-installed --quiet
          cp src/worker/handler.py dist/worker/
          cp -r src/shared dist/worker/
          cd dist/worker && zip -r ../worker.zip . && cd ../..

          # 4. Construir DISPATCHER
          pip install -r dist/requirements.txt -t dist/dispatcher/ --ignore-installed --quiet
          cp src/dispatcher/dispatcher.py dist/dispatcher/
          cp -r src/shared dist/dispatcher/
          cd dist/dispatcher && zip -r ../dispatcher.zip . && cd ../..

          # 5. Construir STATUS
          pip install aws-lambda-powertools aws-xray-sdk -t dist/status/ --quiet
          cp src/status/status.py dist/status/
          cp -r src/shared dist/status/
          cd dist/status && zip -r ../status.zip . && cd ../..

          # 6. Construir UPLOAD
          pip install aws-lambda-powertools aws-xray-sdk -t dist/upload/ --quiet
          cp src/upload/upload.py dist/upload/
          cp -r src/shared dist/upload/
          cd dist/upload && zip -r ../upload.zip . && cd ../..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        working-directory: infra/environments/dev
        env:
          TF_VAR_aws_region: "us-east-1"
          TF_VAR_use_localstack: "false"
          TF_VAR_environment: "develop"
          TF_VAR_extension_id: "hafnlkjddgcncigkjfemaibmookldhlp"
        run: |
          terraform init
          terraform apply -auto-approve -input=false

  # --- TRABAJO 2: COMPILACIÓN DEL FRONTEND ---
  build-frontend:
    needs: deploy-dev # <--- PRINCIPIO DE DEPENDENCIA: Solo si el backend está OK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Inject API URL
        working-directory: frontend
        run: |
          # Usamos .env.develop porque Vite lo usa por defecto en 'build'
          # Si el archivo no existe, lo creamos al vuelo
          echo "VITE_API_URL=__API_URL_PLACEHOLDER__" > .env.production
          sed -i 's|__API_URL_PLACEHOLDER__|https://pugu65me5k.execute-api.us-east-1.amazonaws.com/develop|g' .env.production

      - name: Build Extension
        working-directory: frontend
        run: npm run build

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-extension-dev
          path: frontend/dist/
