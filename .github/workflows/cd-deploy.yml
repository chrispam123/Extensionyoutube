name: CD Deployment (Dev)

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SECURITY_TOKEN: testing
      AWS_SESSION_TOKEN: testing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # --- CORRECCIÓN: INSTALAR POETRY ANTES DE SETUP-PYTHON ---
      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry" # Ahora sí encontrará el ejecutable para el caché

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Tests
        run: poetry run pytest

  deploy-dev:
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    outputs:
      api_url: ${{ steps.get_url.outputs.api_url }}
      s3_bucket: ${{ steps.get_url.outputs.s3_bucket }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Build Lambda Artifacts
        run: |
          pipx inject poetry poetry-plugin-export
          rm -rf dist/
          mkdir -p dist/worker dist/dispatcher dist/status dist/upload dist/auth dist/resumer
          poetry export -f requirements.txt --output dist/requirements.txt

          for cmd in worker dispatcher status upload auth resumer; do
            echo "📦 Empaquetando $cmd..."
            pip install -r dist/requirements.txt -t dist/$cmd/ --ignore-installed --quiet
            if [ "$cmd" == "worker" ]; then cp src/worker/handler.py dist/worker/; fi
            if [ "$cmd" == "dispatcher" ]; then cp src/dispatcher/dispatcher.py dist/dispatcher/; fi
            if [ "$cmd" == "status" ]; then cp src/status/status.py dist/status/; fi
            if [ "$cmd" == "upload" ]; then cp src/upload/upload.py dist/upload/; fi
            if [ "$cmd" == "auth" ]; then cp src/auth/auth_handler.py dist/auth/; fi
            if [ "$cmd" == "resumer" ]; then cp src/resumer/resumer.py dist/resumer/; fi
            cp -r src/shared dist/$cmd/
            cd dist/$cmd && zip -r ../$cmd.zip . > /dev/null && cd ../..
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        working-directory: infra/environments/dev
        env:
          TF_VAR_aws_region: "us-east-1"
          TF_VAR_use_localstack: "false"
          TF_VAR_environment: "develop"
          TF_VAR_extension_id: "hafnlkjddgcncigkjfemaibmookldhlp"
        run: |
          terraform init
          terraform apply -auto-approve -input=false

      - name: Get API URL from Terraform
        id: get_url
        working-directory: infra/environments/dev
        run: |
          URL=$(terraform output -raw api_url)
          echo "api_url=$URL" >> $GITHUB_OUTPUT
          BUCKET=$(terraform output -raw s3_bucket_name)
          echo "s3_bucket=$BUCKET" >> $GITHUB_OUTPUT

  deploy-observability-dev:
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    outputs:
      api_url: ${{ steps.get_observability_outputs.outputs.api_url }}
      frontend_bucket: ${{ steps.get_observability_outputs.outputs.frontend_bucket }}
      frontend_distribution_id: ${{ steps.get_observability_outputs.outputs.frontend_distribution_id }}
      frontend_url: ${{ steps.get_observability_outputs.outputs.frontend_url }}
      cognito_issuer: ${{ steps.get_observability_outputs.outputs.cognito_issuer }}
      cognito_client_id: ${{ steps.get_observability_outputs.outputs.cognito_client_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply Observability
        working-directory: infra/observability/environments/dev
        env:
          TF_VAR_aws_region: "us-east-1"
          TF_VAR_environment: "develop"
          TF_VAR_observed_components: '["auth", "upload", "dispatcher", "worker", "status", "resumer"]'
          TF_VAR_observed_queues: '["work", "dlq", "ingestion", "ingestion-dlq"]'
          TF_VAR_api_gateway_stage: "develop"
          TF_VAR_api_gateway_id: "pugu65me5k"
          TF_VAR_eventbridge_rule_name: "extension-resumer-cron-develop"
          TF_VAR_eventbridge_target_function: "extension-resumer-develop"
          TF_VAR_log_retention_days: "14"
          TF_VAR_google_client_id: ${{ secrets.COGNITO_GOOGLE_CLIENT_ID }}
          TF_VAR_google_client_secret: ${{ secrets.COGNITO_GOOGLE_CLIENT_SECRET }}
        run: |
          mkdir -p ../../../../dist
          terraform init
          terraform apply -auto-approve -input=false

      - name: Get observability outputs
        id: get_observability_outputs
        working-directory: infra/observability/environments/dev
        run: |
          echo "api_url=$(terraform output -raw observability_api_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw observability_frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "frontend_distribution_id=$(terraform output -raw observability_frontend_cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw observability_frontend_url)" >> "$GITHUB_OUTPUT"
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> "$GITHUB_OUTPUT"

          echo "cognito_issuer=https://cognito-idp.us-east-1.amazonaws.com/$(terraform output -raw cognito_user_pool_id)" >> "$GITHUB_OUTPUT"

  deploy-observability-frontend-dev:
    needs: deploy-observability-dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: observability/frontend/package-lock.json

      - name: Install observability frontend dependencies
        working-directory: observability/frontend
        run: npm ci

      - name: Build observability frontend
        working-directory: observability/frontend
        env:
          VITE_OBSERVABILITY_API_URL: ${{ needs.deploy-observability-dev.outputs.api_url }}
          VITE_COGNITO_ISSUER: ${{ needs.deploy-observability-dev.outputs.cognito_issuer }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.deploy-observability-dev.outputs.cognito_client_id }}
          VITE_COGNITO_REDIRECT_URI: ${{ needs.deploy-observability-dev.outputs.frontend_url }}/auth/callback
          VITE_COGNITO_LOGOUT_URI: ${{ needs.deploy-observability-dev.outputs.frontend_url }}/
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload frontend to private S3 bucket
        working-directory: observability/frontend
        env:
          FRONTEND_BUCKET: ${{ needs.deploy-observability-dev.outputs.frontend_bucket }}
        run: |
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ needs.deploy-observability-dev.outputs.frontend_distribution_id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  build-frontend:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # ACTUALIZADO A VERSIÓN ESTABLE
      - name: Install Dependencies
        working-directory: frontend
        run: npm install
      - name: Inject Dynamic Config
        working-directory: frontend
        run: |
          echo "VITE_API_URL=${{ needs.deploy-dev.outputs.api_url }}" > .env.production
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.production
      - name: Build Extension
        working-directory: frontend
        run: npm run build
      - name: Configure Manifest for Environment
        working-directory: frontend
        env:
          S3_BUCKET: ${{ needs.deploy-dev.outputs.s3_bucket }}
        run: npm run configure:manifest
      - name: Upload Dev Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-extension-dev
          path: frontend/dist/
