[tool.poetry]
name = "nocturne-worker"
version = "0.1.0"
description = "Worker para procesamiento de suscripciones"
authors = ["mzkchris"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "1.35.0"
aws-lambda-powertools = "3.4.1"
python-dotenv = "1.0.1"
aws-xray-sdk = "^2.15.0"
httpx = "^0.28.1"
pyjwt = "^2.13.0"

[tool.poetry.group.dev.dependencies]
awscli-local = "0.22.0"
pytest = "^9.0.3"
moto = {extras = ["dynamodb", "s3"], version = "^5.2.1"}
pytest-mock = "^3.15.1"
black = "^26.5.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.pytest.ini_options]
pythonpath = [".", "src"] # <--- Añadimos "src" aquí
testpaths = ["tests"]
